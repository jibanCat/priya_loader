# Full CONTRIBUTOR / development environment for priya_loader.
#
#   conda env create -f environment.yml
#   conda activate priya_loader
#   pip install -e .            # editable install of this package
#
# This env is deliberately heavier than the runtime requirements: it includes
# matplotlib (tutorials/plots), pytest (tests), and bigfile (the IC path).
#
# A flux-only USER on a NERSC login node does NOT need this env — the package
# core is just numpy + h5py. The package is not on PyPI yet, so install editable
# from a clone (run from the repo root):
#       pip install -e .            # flux fields + .npz reading, no MPI
#       pip install -e ".[ic]"      # + initial-conditions (adds bigfile)
#       pip install -e ".[dev]"     # + tests/plots (contributors)
# (An nbodykit-based meshing backend is not yet implemented; only numpy CIC ships.)
name: priya_loader
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.21
  - h5py>=3.0
  - matplotlib
  - pytest>=7
  - pip
  - pip:
      - bigfile
